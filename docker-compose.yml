services:
  atlastier:
    build: .
    ports:
      - "8000:8000"
    environment:
      ATLASTIER_DATA_DIR: /data
      ATLASTIER_TIERING_ENABLED: "${ATLASTIER_TIERING_ENABLED:-true}"
      ATLASTIER_HOT_CAPACITY_BYTES: "1048576"
      ATLASTIER_WARM_CAPACITY_BYTES: "10485760"
      ATLASTIER_HOT_LATENCY_MS: "1"
      ATLASTIER_WARM_LATENCY_MS: "15"
      ATLASTIER_COLD_LATENCY_MS: "80"
      ATLASTIER_BACKGROUND_INTERVAL_SECONDS: "2"
    volumes:
      - tier-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    stop_grace_period: 30s

volumes:
  tier-data:
